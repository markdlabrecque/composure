name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Composure checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go from go.mod
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: Install pinned browser tests
        run: bash scripts/install-browser-tests

      - name: Install Chromium system dependencies
        run: .venv-browser/bin/python -m playwright install-deps chromium

      - name: Run Phase 1 gate
        env:
          COMPOSURE_CI_FAILURE_PROBE: '0'
          COMPOSURE_BROWSER_FAILURE_PROBE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-failure-probe') && '1' || '0' }}
        run: bash scripts/test-phase1
